<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - PHP Array Assignment</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f6fb; color: #172338; margin: 0; padding: 30px 16px; }
        main { max-width: 650px; margin: auto; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 3px 14px #00000012; }
        h1 { margin-top: 0; color: #154480; }
        .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #adbbcc; border-radius: 6px; }
        button { margin-top: 22px; padding: 11px 18px; border: 0; border-radius: 6px; background: #154480; color: white; font-size: 1rem; cursor: pointer; }
        button:hover { background: #0d315f; }
    </style>
</head>
<body>
<main>
    <h1>PHP Array Calculator</h1>
    <p>Enter eight numbers to see how PHP arrays change when elements are deleted, reindexed, and sorted.</p>
    <form action="process.php" method="post">
        <div class="fields">
            <div><label for="value1">Value 1</label><input id="value1" name="values[]" type="number" step="any" required value="42"></div>
            <div><label for="value2">Value 2</label><input id="value2" name="values[]" type="number" step="any" required value="15"></div>
            <div><label for="value3">Value 3</label><input id="value3" name="values[]" type="number" step="any" required value="80"></div>
            <div><label for="value4">Value 4</label><input id="value4" name="values[]" type="number" step="any" required value="7"></div>
            <div><label for="value5">Value 5</label><input id="value5" name="values[]" type="number" step="any" required value="33"></div>
            <div><label for="value6">Value 6</label><input id="value6" name="values[]" type="number" step="any" required value="21"></div>
            <div><label for="value7">Value 7</label><input id="value7" name="values[]" type="number" step="any" required value="60"></div>
            <div><label for="value8">Value 8</label><input id="value8" name="values[]" type="number" step="any" required value="10"></div>
        </div>
        <button type="submit">Process Array</button>
    </form>
</main>
</body>
</html>
